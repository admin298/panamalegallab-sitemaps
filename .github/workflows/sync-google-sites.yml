name: Sincronizar Google Sites y sitemaps

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/sync-google-sites.yml'

permissions: {}

concurrency:
  group: pll-google-sites-sitemap-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'admin298/panamalegallab-sitemaps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Obtener la version exacta del repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Ejecutar las pruebas de sincronizacion
        run: python3 -m unittest discover -s automation/tests -p 'test_*.py' -v

      - name: Comprobar las cuatro webs publicadas
        run: python3 automation/sync_sites.py --repo .

      - name: Guardar los cambios y verificar los sitemaps publicos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 automation/publish_pages.py --repo .
